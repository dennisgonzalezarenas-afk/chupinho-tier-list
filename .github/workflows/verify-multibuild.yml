name: Verify multi-build selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-multibuild.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production build groups
        shell: bash
        run: |
          set -euo pipefail
          URL='https://chupinho-tier-list.vercel.app/api/efhub?mode=builds'
          ok=0
          for attempt in 1 2 3 4 5; do
            if curl --max-time 25 -fsSL "$URL&t=$(date +%s)" -o /tmp/builds.json; then
              ok=1
              break
            fi
            sleep 6
          done
          test "$ok" -eq 1
          python - <<'PY'
          import json
          d=json.load(open('/tmp/builds.json'))
          print('count',d.get('count'))
          print('rawCount',d.get('rawCount'))
          print('multiBuildPlayers',d.get('multiBuildPlayers'))
          opts=d.get('buildOptions',{})
          multi={k:v for k,v in opts.items() if len(v)>1}
          print('multi_groups',len(multi))
          for pid,items in multi.items():
              names=' | '.join((x.get('buildName') or '') for x in items)
              players=' | '.join((x.get('playerName') or '') for x in items)
              if 'messi' in (names+' '+players).lower():
                  print('MESSI_MULTI',pid)
                  for x in items:
                      print(x.get('buildName'),x.get('buildID'),x.get('overall'),x.get('booster2'))
          print('sample_multi',[(pid,[x.get('buildName') for x in items]) for pid,items in list(multi.items())[:10]])
          assert d.get('multiBuildPlayers',0) >= 1
          PY
