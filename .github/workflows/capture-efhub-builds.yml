name: Capture eFHUB builds raw

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-efhub-builds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public eFHUB builds
        run: |
          set -e
          mkdir -p debug
          TARGET='https://efhub.com/api/community/builds?userId=116014046796435242846&locale=es'
          ENCODED=$(python - <<'PY'
import urllib.parse
print(urllib.parse.quote('https://efhub.com/api/community/builds?userId=116014046796435242846&locale=es', safe=''))
PY
          )

          ok=0

          if curl -fsSL -A 'Mozilla/5.0' "https://api.allorigins.win/raw?url=$ENCODED" -o debug/efhub-builds-raw.json; then
            if python -m json.tool debug/efhub-builds-raw.json >/dev/null 2>&1; then
              ok=1
            fi
          fi

          if [ "$ok" -ne 1 ]; then
            rm -f debug/efhub-builds-raw.json
            if curl -fsSL -A 'Mozilla/5.0' "https://r.jina.ai/http://https://efhub.com/api/community/builds?userId=116014046796435242846&locale=es" -o debug/efhub-builds-raw.json; then
              if python -m json.tool debug/efhub-builds-raw.json >/dev/null 2>&1; then
                ok=1
              fi
            fi
          fi

          if [ "$ok" -ne 1 ]; then
            echo "Could not obtain valid JSON through proxies"
            exit 1
          fi

      - name: Commit capture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/efhub-builds-raw.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Capture raw eFHUB public builds'
            git push
          fi
