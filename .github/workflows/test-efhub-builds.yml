name: Test eFHUB public builds access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-efhub-builds.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public profile HTML
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          PROFILE='https://efhub.com/es/community/116014046796435242846'
          curl -fsSL -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' "$PROFILE" -o /tmp/profile.html
          echo "profile bytes: $(wc -c </tmp/profile.html)"
          echo "build strings: $(grep -oE '[0-9]{10,}(_[0-9]+){11}' /tmp/profile.html | sort -u | wc -l | tr -d ' ')"
          echo "player build urls: $(grep -oE 'players/[0-9]+[^" ]*build=[0-9_]+' /tmp/profile.html | sort -u | wc -l | tr -d ' ')"
          echo "api endpoint mentions: $(grep -o '/api/community/builds[^" <]*' /tmp/profile.html | sort -u | wc -l | tr -d ' ')"
          echo '--- build-related snippets ---'
          python - <<'PY'
from pathlib import Path
s=Path('/tmp/profile.html').read_text(errors='ignore')
for needle in ['Builds','builds','/api/community/builds','community/build','build=','userBuild']:
    print('\nNEEDLE',needle)
    start=0
    shown=0
    while shown<5:
        i=s.find(needle,start)
        if i<0: break
        print(s[max(0,i-700):i+1300].replace('\n',' ')[:2000])
        start=i+len(needle)
        shown+=1
PY
