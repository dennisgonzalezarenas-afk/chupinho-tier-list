name: Test eFHUB public builds access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-efhub-builds.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect eFHUB community JavaScript
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          PROFILE='https://efhub.com/es/community/116014046796435242846'
          curl --max-time 15 -fsSL -A "$UA" "$PROFILE" -o /tmp/profile.html
          mkdir -p /tmp/chunks
          grep -oE 'src="/_next/static/chunks/[^"]+\.js[^"]*"' /tmp/profile.html             | sed -E 's/^src="//;s/"$//' | sort -u > /tmp/chunk-urls.txt
          echo "chunks: $(wc -l </tmp/chunk-urls.txt)"
          awk '{print NR "\t" $0}' /tmp/chunk-urls.txt > /tmp/numbered.txt
          cat /tmp/numbered.txt | xargs -P 8 -n 2 sh -c 'curl --max-time 8 -fsSL -A "'"$UA"'" "https://efhub.com$2" -o "/tmp/chunks/$1.js" || true' sh
          python -c "from pathlib import Path; needles=['/api/community/builds','community/builds']; files=list(Path('/tmp/chunks').glob('*.js')); items=[(p.name,n,s.find(n),s) for p in files for s in [p.read_text(errors='ignore')] for n in needles if n in s]; print('downloaded',len(files)); print('hits',[(a,b,c) for a,b,c,_ in items]); [print('SNIP',a,b,s[max(0,i-1000):i+3000]) for a,b,i,s in items]"
