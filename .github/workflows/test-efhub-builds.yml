name: Test eFHUB public builds access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-efhub-builds.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test eFHUB auth bootstrap then builds
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          BASE='https://efhub.com'
          PROFILE="$BASE/es/community/116014046796435242846"
          JAR=/tmp/cookies.txt

          req () {
            name="$1"; url="$2"
            code=$(curl --max-time 20 -sS -w '%{http_code}' -o "/tmp/$name.out"               -c "$JAR" -b "$JAR"               -A "$UA"               -H 'Accept-Language: es-ES,es;q=0.9,en;q=0.7'               -H "Referer: $PROFILE"               "$url")
            echo "$name status=$code bytes=$(wc -c <"/tmp/$name.out")"
            head -c 1200 "/tmp/$name.out"; echo
            echo "cookies after $name:"; cat "$JAR" || true
          }

          req profile "$PROFILE"
          req auth_token "$BASE/api/auth/token"
          req auth_session "$BASE/api/auth/session"
          req builds "$BASE/api/community/builds?userId=116014046796435242846&locale=es"
          echo "build strings: $(grep -oE '[0-9]{10,}(_[0-9]+){11}' /tmp/builds.out | sort -u | wc -l | tr -d ' ')"
