name: Verify eFHUB build sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/efhub.js'
      - 'index.html'
      - '.github/workflows/test-efhub-builds.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production build feed
        shell: bash
        run: |
          set -euo pipefail
          URL='https://chupinho-tier-list.vercel.app/api/efhub?mode=builds'
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt $attempt"
            if curl --max-time 25 -fsSL "$URL&t=$(date +%s)" -o /tmp/builds.json; then
              python -c "import json; d=json.load(open('/tmp/builds.json')); print('count',d.get('count')); print('pages',d.get('pages')); print('source_status',d.get('source',{}).get('status')); print('has_endrick','106776376796960' in d.get('builds',{})); print('has_pato','88038776539586' in d.get('builds',{})); assert d.get('count',0) > 20"
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" -eq 1
