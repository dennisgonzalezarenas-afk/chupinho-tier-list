name: Verify 12 eFHUB lists

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tier-sources.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production
        run: sleep 5
      - name: Inspect changed card metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/efhub-lists
          for i in $(seq 1 12); do
            curl -fsSL --retry 3 --retry-delay 2               "https://chupinho-tier-list.vercel.app/api/efhub?mode=list&id=$i"               -o "/tmp/efhub-lists/$i.html"
          done
          python - <<'PY'
          from pathlib import Path
          import re, html
          ids=[
            '88038776539586','88045755964138','88045755829779',
            '88045755859255','88045755835027','88045755829367'
          ]
          blob='\n'.join(Path(f'/tmp/efhub-lists/{i}.html').read_text(errors='ignore') for i in range(1,13))
          for pid in ids:
              k=blob.find('player_cards/'+pid)
              print('\nID',pid,'INDEX',k)
              if k<0: continue
              snippet=blob[max(0,k-1200):k+1800]
              snippet=html.unescape(snippet)
              snippet=re.sub(r'\\u003c','<',snippet)
              snippet=re.sub(r'\\u003e','>',snippet)
              snippet=re.sub(r'\\u0026','&',snippet)
              snippet=re.sub(r'\\','',snippet)
              print(snippet[:3000])
          PY
