<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChuPiNho Tier List (en evolución)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Orbitron:wght@600;700;800&display=swap');

:root {
  --bg:#050913;
  --panel:#0b1220;
  --text:#f6f8ff;
  --muted:#9ca9bf;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 50% 0,#13213b 0,#050913 44%,#03060b 100%);color:var(--text);font-family:'Montserrat',Segoe UI,Arial,sans-serif}
body{min-height:100vh}
.controls{
  position:sticky;top:0;z-index:50;padding:14px 18px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:rgba(3,7,14,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08)
}
button{
  appearance:none;border:1px solid rgba(255,255,255,.15);background:#111b2c;color:white;
  padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer
}
button:hover{background:#18263d}
button.active{outline:2px solid #54a4ff;background:#17325a}
main{width:min(100%,3840px);margin:auto;padding:24px}

.hero{
  position:relative;
  display:flex;
  align-items:center;
  gap:26px;
  padding:24px 28px 30px;
  margin-bottom:22px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;
  background:
    linear-gradient(135deg, rgba(14,30,57,.96) 0%, rgba(7,12,23,.96) 55%, rgba(30,10,28,.94) 100%);
  box-shadow:
    0 20px 60px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.05);
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:
    radial-gradient(circle at 22% 45%, rgba(0,104,255,.18), transparent 24%),
    radial-gradient(circle at 84% 25%, rgba(255,30,84,.15), transparent 26%),
    radial-gradient(circle at 60% 100%, rgba(255,183,0,.10), transparent 28%);
  pointer-events:none;
}
.brand-logo-wrap{
  position:relative;
  z-index:1;
  flex:0 0 auto;
  width:145px;
  height:145px;
  display:grid;
  place-items:center;
}
.brand-logo{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 0 18px rgba(255,156,0,.16))
         drop-shadow(0 0 18px rgba(0,110,255,.12));
}
.hero-content{
  position:relative;
  z-index:1;
  min-width:0;
  flex:1 1 auto;
}
.hero-title{
  margin:0;
  font-family:'Orbitron','Montserrat','Segoe UI',Arial,sans-serif;
  font-size:clamp(42px,4.8vw,92px);
  line-height:.98;
  font-weight:800;
  letter-spacing:-.035em;
  text-transform:none;
  color:#fff;
  text-shadow:
    0 0 18px rgba(41,151,255,.16),
    0 2px 18px rgba(0,0,0,.6);
}
.hero-title .evolution{
  display:inline-block;
  margin-left:.25em;
  font-family:'Montserrat','Segoe UI',Arial,sans-serif;
  font-size:.36em;
  font-weight:800;
  letter-spacing:.02em;
  color:#ffd56a;
  vertical-align:middle;
  white-space:nowrap;
}
.hero-description{
  margin:16px 0 0;
  color:#cbd5e7;
  font-family:'Montserrat','Segoe UI',Arial,sans-serif;
  font-size:clamp(14px,1.1vw,21px);
  font-weight:600;
  line-height:1.45;
}
.double-click-banner{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:16px;
  width:max-content;
  max-width:100%;
  padding:11px 15px;
  border:1px solid rgba(255,208,71,.38);
  border-radius:13px;
  background:linear-gradient(90deg,rgba(255,193,7,.15),rgba(255,121,0,.08));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
}
.double-click-icon{
  flex:0 0 auto;
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(255,207,72,.16);
  font-size:20px;
}
.double-click-text{
  font-family:'Montserrat','Segoe UI',Arial,sans-serif;
  font-size:clamp(13px,1vw,18px);
  font-weight:800;
  color:#fff2b2;
  letter-spacing:.01em;
}
.double-click-text strong{
  color:#ffd04a;
  font-weight:900;
}
.double-click-text .arrow{
  color:#6fc1ff;
  margin:0 6px;
}
@media (max-width:900px){
  .hero{gap:16px;padding:18px 16px 22px;align-items:flex-start}
  .brand-logo-wrap{width:92px;height:92px}
  .hero-title{font-size:clamp(32px,8vw,56px)}
  .hero-title .evolution{display:block;margin:.35em 0 0;font-size:.42em}
  .double-click-banner{width:100%}
}
@media (max-width:620px){
  .hero{flex-direction:column}
  .brand-logo-wrap{width:100px;height:100px}
}

.category{
  --accent:#2d8cff;
  margin:0 0 22px;border:1px solid var(--accent-border);
  border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  box-shadow:0 10px 30px rgba(0,0,0,.28)
}
.cat-head{
  display:flex;align-items:center;gap:14px;padding:12px 16px;
  background:linear-gradient(90deg,var(--accent-head),rgba(10,16,28,.96) 70%);
  border-bottom:1px solid var(--accent-bottom)
}
.cat-num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:21px;background:var(--accent);color:#08101b}
.cat-title{font-size:clamp(21px,1.55vw,34px);font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.count{margin-left:auto;color:#d9e2f0;font-weight:700;opacity:.8}
.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
  gap:12px;padding:16px
}
.card{
  min-width:0;background:#08101d;border:1px solid rgba(255,255,255,.09);
  border-radius:12px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.34)
}
.card img{display:block;width:100%;aspect-ratio:240/340;object-fit:cover;background:#111}
.info{padding:8px 7px 9px;min-height:57px}
.name{font-weight:800;font-size:13px;line-height:1.15;white-space:normal}
.meta{margin-top:5px;color:#bac7da;font-size:12px;font-weight:700}


.farewell-wrap{
  width:min(100%, 1380px);
  margin:26px auto 18px;
  padding:6px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(135deg,rgba(10,20,38,.82),rgba(16,9,23,.84));
  box-shadow:0 18px 48px rgba(0,0,0,.34);
}
.farewell-image{
  display:block;
  width:100%;
  height:auto;
  border-radius:16px;
}
body.single .farewell-wrap{display:none}


.source-note{color:#7f8ba0;font-size:12px;padding:0 6px 20px}
body.clean .controls{display:none}
body.clean main{padding-top:10px}
body.clean .source-note{display:none}
body.single .category{display:none}
body.single .category.selected{display:block}
body.single .hero p{display:none}
@media (min-width:1800px){
  .cards{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:14px}
  .name{font-size:14px} .meta{font-size:13px}
}
@media (max-width:900px){
  main{padding:12px} .cards{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:10px}
  .cat-head{padding:10px 12px} .cat-num{width:34px;height:34px;font-size:18px}
}
</style>
</head>

  <button data-cat="3">2º delanteros</button>
  <button data-cat="4">MP / interiores</button>
  <button data-cat="5">MC con tiro</button>
  <button data-cat="6">Mixtos</button>
  <button data-cat="7">MCD</button>
  <button data-cat="8">Lat. defensivos</button>
  <button data-cat="9">Lat. ofensivos</button>
  <button data-cat="10">Def. altos</button>
  <button data-cat="11">Def. completos</button>
  <button data-cat="12">Porteros</button>
  <button id="syncBtn">Actualizar desde eFHUB</button><button id="forceBtn">Forzar actualización</button><span id="syncStatus" style="font-size:12px;color:#9ca9bf;font-weight:700"></span><button id="cleanBtn">Modo directo</button>
  <button id="fullBtn">Pantalla completa</button>
  <button id="jpgBtn">Exportar JPG</button>
</div>

const app = document.getElementById('app');

const EFHUB_PLAYER_BASE = 'https://efhub.com/es/players/';

function efhubPlayerIdFromCard(card) {
  const img = card?.querySelector('img');
  if (!img) return null;

  const sources = [
    img.dataset.direct || '',
    img.getAttribute('src') || '',
    img.currentSrc || ''
  ];

  for (const raw of sources) {
    let decoded = raw;
    try { decoded = decodeURIComponent(raw); } catch(e) {}
    const match = decoded.match(/player_cards\/(\d+)(?:_l)?\.png/i);
    if (match) return match[1];
  }
  return null;
}

app.addEventListener('dblclick', (event) => {
  const card = event.target.closest('.card');
  if (!card || !app.contains(card)) return;

  const playerId = efhubPlayerIdFromCard(card);
  if (!playerId) return;

  window.open(
    EFHUB_PLAYER_BASE + playerId,
    '_blank',
    'noopener,noreferrer'
  );
});

}

    img.dataset.triedProxy = '1';
    const direct = img.dataset.direct || img.src;
    img.src = directToProxy(direct);
  });
}


function hexToRgb(hex) {
  const h = String(hex || '').replace('#','');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return {r:45,g:140,b:255};
  return {
    r: parseInt(h.slice(0,2),16),
    g: parseInt(h.slice(2,4),16),
    b: parseInt(h.slice(4,6),16)
  };
}
function mixRgb(hexA, hexB, weightA) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const w = Math.max(0, Math.min(1, weightA));
  const r = Math.round(a.r*w + b.r*(1-w));
  const g = Math.round(a.g*w + b.g*(1-w));
  const bl = Math.round(a.b*w + b.b*(1-w));
  return `rgb(${r},${g},${bl})`;
}
function rgbaFromHex(hex, alpha) {
  const c = hexToRgb(hex);
  return `rgba(${c.r},${c.g},${c.b},${alpha})`;
}

      <div class="cat-head">

            <div class="info">

              <div class="meta">${p.rating} · ${esc(p.pos)}</div>

          </article>`).join('')}
      </div>

}

function normalizeText(s) {
  return (s || '').replace(/\s+/g, ' ').trim();
}
function normalizeName(s) {
  return normalizeText(s)
    .replace(/Gaúcho/g,'Gaucho')
    .replace(/Nedvěd/g,'Nedved')
    .replace(/Kaká/g,'Kaka')
    .replace(/Romário/g,'Romario')
    .replace(/Suárez/g,'Suarez')
    .replace(/Dembélé/g,'Dembele')
    .replace(/Mbappé/g,'Mbappe')
    .replace(/Tévez/g,'Tevez')
    .replace(/Forlán/g,'Forlan')
    .replace(/Álvarez/g,'Alvarez')
    .replace(/Ribéry/g,'Ribery')
    .replace(/Piqué/g,'Pique')
    .replace(/Araújo/g,'Araujo')
    .replace(/Tchouaméni/g,'Tchouameni')
    .replace(/Šeško/g,'Sesko')
    .replace(/HoeneSS/g,'Hoeness')
    .replace(/Hoeneß/g,'Hoeness');
}
function cardUrlFromImg(img) {
  let src = img.getAttribute('src') || img.getAttribute('data-src') || '';
  try {
    const u = new URL(src, SOURCE_URL);
    if (u.pathname.includes('/_next/image') && u.searchParams.get('url')) {
      return new URL(decodeURIComponent(u.searchParams.get('url')), SOURCE_URL).href;
    }
    return u.href;
  } catch(e) {
    return src;
  }
}
function extractRatingPos(img, name) {
  let el = img.parentElement;
  for (let i=0; el && i<8; i++, el=el.parentElement) {
    const t = normalizeText(el.textContent);
    const m = t.match(/\b(\d{2,3})\s*(GK|CB|LB|RB|DMF|CMF|LMF|RMF|AMF|LWF|RWF|SS|CF)\b/i);
    if (m) return {rating:m[1], pos:m[2].toUpperCase()};
  }
  return {rating:'', pos:''};
}

function stripMd(s) {
  return normalizeText((s || '')
    .replace(/!\[[^\]]*\]\([^)]+\)/g, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/[*_`>#-]+/g, ' ')
  );
}

function extractPlayersFromHtml(raw) {
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  const tiers = new Set(['S+','S','A','B','C','D','E']);
  let currentTier = null;
  const found = [];

  const walker = doc.createTreeWalker(doc.body || doc.documentElement, NodeFilter.SHOW_ELEMENT);
  let node;
  while ((node = walker.nextNode())) {
    if (node.children.length === 0) {
      const tx = normalizeText(node.textContent);
      if (tiers.has(tx)) currentTier = tx;
    }
    if (node.tagName === 'IMG') {
      const src = cardUrlFromImg(node);
      if (!/efimg\.com\/efootballhub22\/images\/player_cards\//i.test(src)) continue;
      const alt = normalizeText(node.getAttribute('alt')).replace(/^Image:\s*/i,'');
      if (!alt) continue;
      const rp = extractRatingPos(node, alt);
      found.push({
        tier: currentTier,
        name: alt,
        rating: rp.rating,
        pos: rp.pos,
        img: src
      });
    }
  }

  const result = [];
  const seen = new Set();
  for (const p of found) {
    const key = [p.tier, normalizeName(p.name), p.img].join('|');
    if (seen.has(key)) continue;
    seen.add(key);
    result.push(p);
  }
  return result;
}

function extractPlayersFromMarkdown(raw) {
  const lines = raw.replace(/\r/g,'').split('\n').map(x => x.trim());
  const tiers = new Set(['S+','S','A','B','C','D','E']);
  const found = [];
  let currentTier = null;

  for (let i = 0; i < lines.length; i++) {
    const clean = stripMd(lines[i]);
    if (tiers.has(clean)) {
      currentTier = clean;
      continue;
    }

    const im = lines[i].match(/!\[(?:Image:\s*)?([^\]]+)\]\((https?:\/\/[^)]+)\)/i);
    if (!im) continue;

    const nameFromAlt = normalizeText(im[1]).replace(/^Image:\s*/i,'');
    const img = im[2];

    if (!/efimg\.com\/efootballhub22\/images\/player_cards\//i.test(img)) continue;

    let rating = '', pos = '', name = nameFromAlt;
    for (let j = i + 1; j < Math.min(lines.length, i + 8); j++) {
      const t = stripMd(lines[j]);
      if (!t) continue;
      const rp = t.match(/^(\d{2,3})\s*(GK|CB|LB|RB|DMF|CMF|LMF|RMF|AMF|LWF|RWF|SS|CF)$/i);
      if (rp && !rating) {
        rating = rp[1];
        pos = rp[2].toUpperCase();
        continue;
      }
      if (rating && t && !tiers.has(t) && !/^(Image:|Capture|Copier|Tier Lists|Listes de niveaux)/i.test(t)) {
        // Jina normally puts the visible player name immediately after the rating/position.
        name = t;
        break;
      }
    }

    found.push({tier: currentTier, name, rating, pos, img});
  }

  const result = [];
  const seen = new Set();
  for (const p of found) {
    const key = [p.tier, normalizeName(p.name), p.img].join('|');
    if (seen.has(key)) continue;
    seen.add(key);
    result.push(p);
  }
  return result;
}

function extractPlayers(raw) {
  let players = [];
  if (/<html|<body|<img/i.test(raw)) {
    players = extractPlayersFromHtml(raw);
  }
  if (players.length < 20) {
    const md = extractPlayersFromMarkdown(raw);
    if (md.length > players.length) players = md;
  }
  return players;
}

function splitLivePlayers(players) {
  const template = FALLBACK_DATA.map(c => ({...c, players:[]}));
  const byId = id => template.find(c => c.id === id);

  const splus = players.filter(p => p.tier === 'S+');
  const s = players.filter(p => p.tier === 'S');
  const a = players.filter(p => p.tier === 'A');
  const b = players.filter(p => p.tier === 'B');
  const c = players.filter(p => p.tier === 'C');
  const d = players.filter(p => p.tier === 'D');
  const e = players.filter(p => p.tier === 'E');

  const raquel = splus.findIndex(p => normalizeName(p.name) === 'Raquel Lombardi');
  const onuachu = splus.findIndex(p => normalizeName(p.name) === 'Paul Onuachu');
  const splitSplus = raquel >= 0 ? raquel : (onuachu >= 0 ? onuachu + 1 : 10);

  byId(1).players = splus
    .slice(0, splitSplus)
    .filter(p => !['Raquel Lombardi','Marco van Basten'].includes(normalizeName(p.name)));
  byId(2).players = splus
    .slice(splitSplus)
    .filter(p => normalizeName(p.name) !== 'Raquel Lombardi');

  byId(3).players = s;
  byId(4).players = a;

  const castelo = b.findIndex(p => normalizeName(p.name) === 'Rafael Castelo');
  const verlaine = b.findIndex(p => normalizeName(p.name) === 'Gedeon Verlaine');
  const lampard = b.findIndex(p => normalizeName(p.name) === 'Frank Lampard');
  const robson = b.findIndex(p => normalizeName(p.name) === 'Bryan Robson');

  const cut1 = castelo >= 0 ? castelo : (lampard >= 0 ? lampard + 1 : 5);
  const cut2 = verlaine >= 0 ? verlaine : (robson >= 0 ? robson + 1 : b.length);

  byId(5).players = b.slice(0, cut1)
    .filter(p => !['Rafael Castelo','Gedeon Verlaine'].includes(normalizeName(p.name)));
  byId(6).players = b.slice(castelo >= 0 ? castelo + 1 : cut1, cut2)
    .filter(p => !['Rafael Castelo','Gedeon Verlaine'].includes(normalizeName(p.name)));
  byId(7).players = b.slice(verlaine >= 0 ? verlaine + 1 : cut2)
    .filter(p => !['Rafael Castelo','Gedeon Verlaine'].includes(normalizeName(p.name)));

  const getByName = (arr, name) => arr.find(p => normalizeName(p.name) === name);
  const maldini = getByName(d, 'Paolo Maldini');

  byId(8).players = [
    getByName(c, 'Lilian Thuram'),
    maldini ? {...maldini} : null,
    getByName(c, 'Giuseppe Bergomi'),
    getByName(c, 'A. Costacurta')
  ].filter(Boolean);

  const lateralDef = new Set(['Lilian Thuram','Giuseppe Bergomi','A. Costacurta']);
  byId(9).players = c.filter(p => !lateralDef.has(normalizeName(p.name)));

  // Defensas altos: desde Rio Ferdinand hasta Gerard Pique, ambos incluidos,
  // respetando exactamente todos los jugadores y el orden de eFHUB entre ambos.
  const ferdinand = d.findIndex(p => normalizeName(p.name) === 'Rio Ferdinand');
  const pique = d.findIndex(p => normalizeName(p.name) === 'Gerard Pique');
  if (ferdinand >= 0 && pique >= ferdinand) {
    byId(10).players = d.slice(ferdinand, pique + 1);
    byId(11).players = d.slice(pique + 1)
      .filter(p => !normalizeName(p.name).includes('Callejo'));
  } else {
    byId(10).players = FALLBACK_DATA.find(x => x.id === 10)?.players.map(p => ({...p})) || [];
    byId(11).players = FALLBACK_DATA.find(x => x.id === 11)?.players.map(p => ({...p})) || [];
  }

  byId(12).players = e;

  // Mantener la versión actual de Totti si una copia cacheada de eFHUB devuelve otra.
  {
    const i = byId(3).players.findIndex(p => normalizeName(p.name) === 'Francesco Totti');
    const fallbackTotti = FALLBACK_DATA.flatMap(x => x.players)
      .find(x => normalizeName(x.name) === 'Francesco Totti');
    if (i >= 0 && fallbackTotti) {
      byId(3).players[i] = {...fallbackTotti};
    }
  }

  const fallbackPool = FALLBACK_DATA.flatMap(x => x.players);
  for (const cat of template) {
    cat.players = cat.players.map(p => {
      const same = fallbackPool.find(x => normalizeName(x.name) === normalizeName(p.name) && x.img === p.img)
        || fallbackPool.find(x => normalizeName(x.name) === normalizeName(p.name) && x.rating === p.rating && x.pos === p.pos)
        || fallbackPool.find(x => normalizeName(x.name) === normalizeName(p.name));
      return {
        name: p.name,
        rating: p.rating || same?.rating || '',
        pos: p.pos || same?.pos || '',
        img: p.img || same?.img || ''
      };
    });
  }

  return template;
}
function totalPlayers(data) {
  return data.reduce((n,c)=>n+c.players.length,0);
}
async function fetchWithTimeout(url, ms=15000) {
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  try {
    const r = await fetch(url, {cache:'no-store', signal:controller.signal});
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.text();
  } finally { clearTimeout(timer); }
}

async function getLiveSource() {
  // La web pública usa nuestro propio endpoint de Vercel.
  // Así evitamos CORS y, sobre todo, las copias antiguas de proxies externos.
  let lastErr = null;
  try {
    const txt = await fetchWithTimeout('/api/efhub?t=' + Date.now(), 22000);
    const players = extractPlayers(txt);
    if (players.length >= 20) {
      return {raw: txt, via: 'eFHUB directo', players};
    }
    lastErr = new Error('eFHUB directo: solo se detectaron ' + players.length + ' cartas');
  } catch(e) {
    lastErr = e;
  }

  // Respaldo únicamente si el endpoint propio falla.
  const attempts = [
    { name: 'AllOrigins', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(SOURCE_URL) },
    { name: 'Jina Reader', url: 'https://r.jina.ai/' + SOURCE_URL }
  ];
  for (const a of attempts) {
    try {
      const txt = await fetchWithTimeout(a.url, 22000);
      const players = extractPlayers(txt);
      if (players.length >= 20) return {raw: txt, via: a.name, players};
    } catch(e) { lastErr = e; }
  }
  throw lastErr || new Error('No se pudo leer eFHUB');
}

async function syncFromEfhub(manual=false) {
  const btn = document.getElementById('syncBtn');
  const status = document.getElementById('syncStatus');
  const badge = document.getElementById('liveBadge');
  const old = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Actualizando…'; }
  if (status) status.textContent = 'Leyendo la lista actual…';
  try {
    const source = await getLiveSource();
    const players = source.players || extractPlayers(source.raw);
    const live = splitLivePlayers(players);
    const count = totalPlayers(live);
    if (count < 20) throw new Error('La página se recibió, pero no se pudieron reconocer las cartas.');
    DATA = live;
    render();
    document.querySelectorAll('.card img').forEach(attachFallback);
    try { localStorage.setItem('efhub_live_data_v11_profiles', JSON.stringify(DATA)); } catch(e) {}
    if (status) status.textContent = `${count} cartas sincronizadas · ${source.via}`;
    if (badge) { badge.textContent='Sincronizada ahora'; badge.style.color='#67d391'; }
    return true;
  } catch(e) {
    if (status) status.textContent = 'Usando copia integrada';
    if (badge) { badge.textContent='Copia integrada'; badge.style.color='#f5c451'; }
    if (manual) alert('No he podido leer la web de eFHUB en directo desde este navegador. Se mantiene la última copia integrada.\n\n'+e.message);
    return false;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = old || 'Actualizar desde eFHUB'; }
  }
}
document.getElementById('syncBtn')?.addEventListener('click', ()=>syncFromEfhub(true));
document.getElementById('forceBtn')?.addEventListener('click', ()=>{ try{localStorage.removeItem('efhub_live_data_v11_profiles')}catch(e){}; syncFromEfhub(true); });

// If a previous live sync exists, show it immediately, then refresh from eFHUB.
try {
  const saved = JSON.parse(localStorage.getItem('efhub_live_data_v11_profiles') || 'null');
  if (Array.isArray(saved) && totalPlayers(saved) > 20) {
    DATA = saved;
    render();
    document.querySelectorAll('.card img').forEach(attachFallback);
  }
} catch(e) {}
if (new URLSearchParams(location.search).get('nosync') !== '1') {
  setTimeout(()=>syncFromEfhub(false), 100);
}

async function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src=src; s.onload=resolve; s.onerror=reject; document.head.appendChild(s);
  });
}

async function waitImages(){
  const imgs=[...document.images];
  await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=r;img.onerror=r;})));
}
async function prepareImagesForExport() {
  const imgs=[...document.querySelectorAll('.card img')];
  imgs.forEach(img => {
    const direct = img.dataset.direct || img.src;
    img.dataset.beforeExport = img.src;
    img.crossOrigin = 'anonymous';
    img.src = directToProxy(direct);
  });
  await Promise.all(imgs.map(img => new Promise(resolve => {
    if (img.complete && img.naturalWidth) return resolve();
    const done = () => resolve();
    img.addEventListener('load', done, {once:true});
    img.addEventListener('error', done, {once:true});
  })));
  await new Promise(r => setTimeout(r, 250));
}
function restoreImagesAfterExport() {
  document.querySelectorAll('.card img').forEach(img => {
    img.removeAttribute('crossorigin');
    if (img.dataset.beforeExport) {
      img.src = img.dataset.beforeExport;
      delete img.dataset.beforeExport;
    }
  });
}
document.getElementById('jpgBtn').addEventListener('click', async () => {
  const btn=document.getElementById('jpgBtn'); const old=btn.textContent;
  btn.textContent='Preparando JPG...'; btn.disabled=true;
  try {
    await prepareImagesForExport();
    if(!window.html2canvas) await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    const target=document.getElementById('capture');
    const canvas=await html2canvas(target,{
      backgroundColor:'#050913',
      scale:2,
      useCORS:true,
      allowTaint:false,
      logging:false,
      imageTimeout:30000
    });
    const a=document.createElement('a');
    a.download='tier_list_efootball_personalizada.jpg';
    a.href=canvas.toDataURL('image/jpeg',0.98);
    a.click();
  } catch(e) {
    alert('La exportación automática no ha podido completarse. Las cartas visibles siguen siendo las originales de eFHUB. Abre este HTML descargado en Chrome o Edge e inténtalo de nuevo.\n\n'+e);
  } finally {
    restoreImagesAfterExport();
    btn.textContent=old; btn.disabled=false;
  }
});
